  - key: ops_incidents
    name: "Ops & Incidents"
    type: group
    export_format: android
    date_order: DMY
    participants: ["Rahim", "Farah (Ops Head)", "Jamal", "Rafi (Warehouse Lead)"]
    messages:
      - day: 0
        time: "08:00"
        sender: "Rahim"
        text: "গোডাউনে আবার লিকেজ হচ্ছে, গতকালও বলেছিলাম"
        planted_scenario: recurring_issue_occurrence_1
        gold:
          type: issue
          title: "Warehouse roof leakage recurring"
          status_hint: new
      - day: 0
        time: "08:05"
        sender: "Farah (Ops Head)"
        text: "Noted, will check with maintenance."
      - day: 1
        time: "09:00"
        sender: "Jamal"
        text: "Morning stock count done, all matches."
      - day: 2
        time: "10:00"
        sender: "Rahim"
        text: "Ei je abar leak hocche section B te, ajke o dekhlam."
        planted_scenario: recurring_issue_occurrence_2
      - day: 2
        time: "10:05"
        sender: "Farah (Ops Head)"
        text: "This is the second time, will escalate to facilities."
      - day: 3
        time: "09:00"
        sender: "Rafi (Warehouse Lead)"
        text: "গোডাউনের ছাদ দিয়ে আবার পানি পড়ছে, তিনবার হয়ে গেলো এই মাসে।"
        planted_scenario: recurring_issue
        gold:
          type: issue
          title: "Warehouse roof leakage recurring"
          status_hint: update
          related_item_title: "Warehouse roof leakage recurring"
      - day: 3
        time: "09:10"
        sender: "Farah (Ops Head)"
        text: "Escalating this today, it's a pattern now."
      - day: 3
        time: "14:00"
        sender: "Rahim"
        text: "There's also a risk with the fire extinguishers, several are past inspection date, nobody has been assigned to handle it."
        planted_scenario: unowned_risk
        gold:
          type: risk
          title: "Fire extinguishers past inspection date"
          severity: high
          status_hint: new
      - day: 3
        time: "14:05"
        sender: "Jamal"
        text: "Yeah I noticed that too, quite risky."
      - day: 4
        time: "08:30"
        sender: "Rahim"
        text: "কাল রাতে চুরির চেষ্টা হয়েছিল গেটে, সিকিউরিটি গার্ড ধরে ফেলেছে।"
      - day: 4
        time: "08:35"
        sender: "Farah (Ops Head)"
        text: "Good catch by security, will review CCTV footage."
      - day: 5
        time: "09:00"
        sender: "Jamal"
        text: "Everything quiet today, no incidents."
      - day: 6
        time: "10:00"
        sender: "Rahim"
        text: "Section A stock count off by 3 units, investigating."
      - day: 6
        time: "10:30"
        sender: "Jamal"
        text: "Found it, was a labeling error, corrected now."
      - day: 7
        time: "09:00"
        sender: "Farah (Ops Head)"
        text: "Good work resolving that quickly."
      - day: 8
        time: "11:00"
        sender: "Rafi (Warehouse Lead)"
        text: "Roof leak still not fixed, raising with the building owner directly now."
      - day: 9
        time: "09:00"
        sender: "Rahim"
        text: "Quiet day, all normal."
      - day: 10
        time: "10:00"
        sender: "Jamal"
        text: "Forklift battery replaced, back in service."

  - key: client_shapla_retail
