      - day: 2
        time: "09:00"
        sender: "Farah (Ops Head)"
        text: "Update: root cause was a warehouse dispatch delay, we've fixed the process and your next order ships today."
      - day: 2
        time: "09:30"
        sender: "Shapla Contact - Imran"
        text: "Thank you, appreciate the quick response."
      - day: 3
        time: "10:00"
        sender: "Shapla Contact - Imran"
        text: "Order received on time today, thanks."
      - day: 4
        time: "11:00"
        sender: "Farah (Ops Head)"
