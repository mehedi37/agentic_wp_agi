org: "Nodi Logistics Ltd (fictional)"
chats:
  - key: management_team
    name: "Management Team"
    type: group
    export_format: android
    date_order: DMY
    participants: ["Kamal (MD)", "Farah (Ops Head)", "Rafi (Warehouse Lead)"]
    messages:
      - day: 0
        time: "09:15"
        sender: "Kamal (MD)"
        text: "Team, decision: we are moving the Padma warehouse rollout to Q2. Confirmed in yesterday's board call."
      - day: 0
        time: "09:17"
        sender: "Farah (Ops Head)"
        text: "Noted, will update the project plan."
      - day: 0
        time: "09:18"
        sender: "Rafi (Warehouse Lead)"
        text: "Got it, will hold off on the Padma hiring then."
      - day: 1
        time: "10:00"
        sender: "Kamal (MD)"
        text: "Good morning all. Quick one: are we still on track for the Shapla Retail quarterly review?"
      - day: 1
        time: "10:05"
        sender: "Farah (Ops Head)"
        text: "Yes, Thursday 3pm as planned."
      - day: 2
        time: "11:00"
        sender: "Kamal (MD)"
        text: "Decision: approving the new forklift purchase for the warehouse, budget capped at 8 lakh taka."
      - day: 2
        time: "11:02"
        sender: "Rafi (Warehouse Lead)"
        text: "Thank you, will get quotes from two vendors."
      - day: 3
        time: "09:30"
        sender: "Farah (Ops Head)"
        text: "Kamal, what's the status on the Shapla contract renewal? Legal was supposed to send it last week."
        planted_scenario: unanswered_question
        gold:
          type: issue
          title: "Shapla Retail contract renewal status unclear"
          status_hint: new
      - day: 3
        time: "09:45"
        sender: "Rafi (Warehouse Lead)"
        text: "Forklift quotes in, sending to Farah separately."
      - day: 4
        time: "14:00"
        sender: "Kamal (MD)"
        text: "Team lunch Friday, usual place, 1pm."
      - day: 4
        time: "14:02"
        sender: "Farah (Ops Head)"
        text: "In!"
      - day: 5
        time: "08:50"
        sender: "Rafi (Warehouse Lead)"
        text: "Morning, warehouse audit went smoothly yesterday, no major issues."
      - day: 6
        time: "10:02"
        sender: "Kamal (MD)"
        text: "Reversing that -- board wants Padma rollout back on the original Q1 timeline after all. Sorry for the churn."
        planted_scenario: reversed_decision
        gold:
          type: decision
          title: "Padma warehouse rollout timeline reversed back to Q1"
          status_hint: update
          related_item_title: "Padma warehouse rollout moved to Q2"
      - day: 6
        time: "10:05"
        sender: "Farah (Ops Head)"
        text: "Understood, will re-plan for Q1."
      - day: 6
        time: "10:06"
        sender: "Rafi (Warehouse Lead)"
        text: "OK, resuming the Padma hiring then."
      - day: 8
        time: "09:00"
        sender: "Kamal (MD)"
        text: "Reminder: Friday is a public holiday, office closed."
      - day: 9
        time: "15:30"
        sender: "Farah (Ops Head)"
        text: "Client escalation from Shapla this morning, escalating separately in the client chat."
      - day: 10
        time: "09:10"
        sender: "Kamal (MD)"
        text: "Approved the extra headcount for Padma warehouse, two new pickers starting next month."

